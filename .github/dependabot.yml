# Monthly, and every update for an ecosystem bundled into one PR (security
# updates into one more). Dependabot cannot group across ecosystems, so a repo
# gets at most one PR per entry below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-config-next's bundled eslint-plugin-react crashes under ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # The typescript-eslint inside eslint-config-next refuses to load under TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      githubactions:
        patterns:
          - "*"
      githubactions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
