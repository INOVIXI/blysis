version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/type/lint bumps into a single PR to cut noise.
      dev-dependencies:
        dependency-type: "development"
      types:
        patterns:
          - "@types/*"
    ignore:
      # eslint-config-next's bundled eslint-plugin-react crashes under ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
