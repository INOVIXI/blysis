name: Release Pipeline

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # A pre-release says so in its number, and the number is what puts it on
  # the beta channel. The checkbox on the GitHub release is what keeps it off
  # `latest`. The two are set by hand on release day, so they are held to
  # each other here, and to package.json, before anything is built.
  consistent:
    name: The release says what it is
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag, the pre-release flag and package.json agree
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$'; then
            echo "::error::$TAG is not X.Y.Z, X.Y.Z-beta.N or X.Y.Z-rc.N"
            exit 1
          fi
          case "$version" in
            *-*) expected=true ;;
            *) expected=false ;;
          esac
          if [ "$PRERELEASE" != "$expected" ]; then
            echo "::error::$TAG has the pre-release flag set to $PRERELEASE; a version with a suffix is a pre-release and one without is not"
            exit 1
          fi
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$version" ]; then
            echo "::error::package.json says $pkg and the tag says $version"
            exit 1
          fi

  verify:
    name: Build and test
    needs: consistent
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read

  publish:
    name: Publish image to GHCR
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=blysis
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published to GHCR"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
