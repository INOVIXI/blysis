# Blysis production stack: Postgres, Redis, the app, and (optionally) Caddy.
#
# You should not need to read this file. Run the installer instead:
#
#   curl -fsSL https://blysis.com/install.sh | sudo bash
#
# It writes the .env this file needs, picks the ports, and starts everything.
# To drive compose by hand, copy .env.example to .env and set at minimum
# POSTGRES_PASSWORD and AUTH_SECRET, then `docker compose up -d`.
#
# Companion files:
#   docker-compose.build.yml - build the image from source instead of pulling
#   docker-compose.debug.yml - republish Postgres/Redis on 127.0.0.1
#
# Named volumes persist DB rows, Redis state, uploads, installed modules, the
# compiled app and backups across restarts. `docker compose down -v` wipes all
# of it - including the build, which the next boot then recreates.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blysis
      POSTGRES_USER: blysis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose. Publishing 5432 puts Postgres on the public
    # internet of every VPS this stack is installed on, guarded by nothing but
    # the password. Sibling services reach it over the compose network by name;
    # for a shell use `docker compose exec db psql -U blysis`, and for a host
    # port use the docker-compose.debug.yml override (binds 127.0.0.1 only).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blysis -d blysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence so cached module state + rate-limit counters
    # survive restarts cleanly.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # No `ports:` - same reasoning as db. Redis has no password here; its only
    # protection is being unreachable from outside the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init: on a fresh DB it pushes the schema + seeds roles/admin,
  # then exits. No-op once the DB is initialized, so it is safe on every
  # `up`. The app waits for this to finish successfully before starting.
  migrate:
    image: ${BLYSIS_IMAGE:-ghcr.io/inovixi/blysis}:${BLYSIS_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blysis:${POSTGRES_PASSWORD}@db:5432/blysis
    command: ["npx", "tsx", "scripts/docker-bootstrap.ts"]
    # Same modules volume the app uses. scripts/merge-schemas.ts reads
    # src/modules to rebuild the merged Prisma schema; without this the
    # upgrade path would push a core-only schema over a database that has
    # module tables in it.
    volumes:
      - modules:/app/src/modules
    restart: "no"

  app:
    image: ${BLYSIS_IMAGE:-ghcr.io/inovixi/blysis}:${BLYSIS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blysis:${POSTGRES_PASSWORD}@db:5432/blysis
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
    # APP_BIND_ADDR is 127.0.0.1 when Caddy terminates TLS in front of the
    # app - the container must not also be reachable directly on :3001.
    # Without TLS the installer leaves it at 0.0.0.0 and publishes APP_PORT.
    ports:
      - "${APP_BIND_ADDR:-0.0.0.0}:${APP_PORT:-3001}:3001"
    # Runtime state that must not live inside the read-only image layers.
    volumes:
      # Uploaded files (local storage provider fallback).
      - uploads:/app/public/uploads
      # Installed module code. The image boots with zero modules so admins
      # can pick from the marketplace; this volume keeps their choices.
      - modules:/app/src/modules
      # DB backups written by the automated-backup cron + admin UI.
      - backups:/app/backups
      # The compiled app. Module pages are compiled into the Next build, so
      # installing a module rebuilds it - and that rebuild has to outlive the
      # container or it would be redone on every restart. Docker seeds this
      # volume from the image on first creation, so a fresh install starts
      # with the image's build and never rebuilds at all.
      #
      # After `blysis update` the volume still holds the previous image's
      # build. scripts/reconcile-build.ts detects that at boot (via the
      # image-build-id stamp the volume cannot mask) and rebuilds once, which
      # is also what makes installed modules survive an update.
      - nextbuild:/app/.next
      # The channel to the updater: the panel writes a requested tag here and
      # reads the updater's progress back. No socket, by design.
      - updatestate:/var/lib/blysis/update
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Long enough for a boot-time rebuild after an update. See the matching
      # note on HEALTHCHECK in the Dockerfile.
      start_period: 600s

  # Applies an update asked for from the admin panel.
  #
  # The only service with the Docker socket, deliberately: updating means
  # pulling an image and recreating a container, and the socket is root on the
  # host. The app runs module code that arrives in a ZIP from a marketplace, so
  # it never gets that - it writes a tag it took from the release feed into the
  # shared volume below, and this reads it. `updater.sh` is mounted from the
  # host, not from that volume, so a compromised app cannot rewrite what the
  # socket holder runs.
  #
  # `blysis update` on the host does the same job by hand and is unaffected.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    command: ["sh", "/updater.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose project: the files and the .env whose BLYSIS_VERSION is
      # what pins the running version.
      - ./:/project
      - ./updater.sh:/updater.sh:ro
      - updatestate:/state

  # TLS terminator. Enabled only with `--profile tls`, which the installer
  # passes when the operator supplied a domain. Caddy obtains and renews a
  # Let's Encrypt certificate on its own - no certbot timer to forget.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # No `:?` guard here. Compose interpolates every service's environment
      # even when the service's profile is inactive, so a required-variable
      # check would break every domainless (IP-only) install. install.sh
      # already refuses --tls without a domain, which is the right place for
      # that rule.
      DOMAIN: ${DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  updatestate:
  pgdata:
  redisdata:
  uploads:
  modules:
  nextbuild:
  backups:
  caddydata:
  caddyconfig:
