# Postgres and Redis for developing Blysis, and nothing else.
#
#   npm run services:up      # start both, and wait until they answer
#   npm run services:down    # stop them; the data volume stays
#
# The app itself runs on the host with `npm run dev`: hot reload watching a
# directory mounted into a container is slow everywhere and slowest on
# Windows, and the editor, the type checker and the tests all want the
# host's Node anyway. What this saves is installing and configuring a
# PostgreSQL by hand, on whatever system the checkout is on.
#
# The same images as docker-compose.yml, under a project name of their own so
# a production stack on the same machine keeps its volumes. Both ports bind
# to 127.0.0.1 only. The password is fixed because nothing off this machine
# can reach the database; the production stack never takes it.
#
# A port already in use (a PostgreSQL installed locally, say) moves with
# DEV_DB_PORT / DEV_REDIS_PORT, and DATABASE_URL in .env moves with it.

name: blysis-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blysis
      POSTGRES_USER: blysis
      POSTGRES_PASSWORD: blysis
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blysis -d blysis"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
